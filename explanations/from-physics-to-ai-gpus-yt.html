    --bg-card: #282726;
    --ink: #CECDC3;
    --ink-muted: #878580;
    --border: #403E3C;

  body {

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--border);

    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;

    border-color: var(--blue);
    color: var(--blue);
  }

    background: var(--blue);
    color: #FFFCF0;
    border-color: var(--blue);
  }

    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .pipeline-strip svg {
    width: 100%;
    height: 102px;
    overflow: visible;
  }

  .pipe-node {
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .pipe-node rect {
    fill: var(--bg-panel);
    stroke: var(--border);
    stroke-width: 1.5;
    rx: 6;
    transition: all 0.15s ease;
  }

  .pipe-node.active rect {
    fill: var(--accent-bg);
    stroke: var(--blue);
    stroke-width: 2.5;
  }

  .pipe-node.done rect {
    stroke: var(--green);
  }

  .pipe-node.missing-bridge rect {
    stroke-dasharray: 4 2;
    stroke: var(--orange);
  }

  .pipe-node.missing-bridge.active rect {
    stroke-dasharray: none;
    stroke: var(--orange);
    fill: rgba(188, 82, 21, 0.12);
  }

  /* MAIN 3-COLUMN WORKSPACE */
  main {
    display: grid;
    grid-template-columns: 290px 1fr 340px;
    height: 100%;
    overflow: hidden;
  }

  /* LEFT: VIDEO SEQUENCER */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);

    flex-direction: column;
    overflow-y: auto;
    padding: 10px;
    gap: 6px;

    font-weight: 700;
    text-transform: uppercase;

    padding: 2px 4px 4px;
    display: flex;
    justify-content: space-between;

    border: 1px solid var(--border);

    padding: 8px 10px;

    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 8px;
    align-items: start;
    transition: all 0.12s ease;

  .step-card:hover {
    border-color: var(--ink-muted);
  }

  .step-card.active {
    border-color: var(--blue);
    box-shadow: inset 3px 0 0 var(--blue);
    background: var(--accent-bg);
  }

  .step-card.gap-card.active {
    border-color: var(--orange);
    box-shadow: inset 3px 0 0 var(--orange);
  }

  .step-check {
    width: 16px;
    height: 16px;
    margin-top: 2px;
    accent-color: var(--green);
    cursor: pointer;
  }

  .step-meta {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-muted);
    text-transform: uppercase;
  }

  .step-name {
    font-size: 12.5px;
    font-weight: 700;
    margin: 2px 0;
    line-height: 1.25;
  }

  .step-sub {
    font-size: 11px;
    color: var(--ink-muted);
  }

  .step-time {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 3px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--ink-muted);

    display: grid;
    grid-template-rows: 1fr 220px;
    overflow: hidden;
    background: var(--bg);
  }

  .diagram-stage {
    position: relative;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  .stage-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .stage-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;

    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-panel);

    height: 100%;

  .video-links-row {

    gap: 8px;
    flex-wrap: wrap;

  .yt-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    background: var(--red);
    color: #FFFCF0;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;

    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  .yt-btn:hover {

  }

  .watch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;

  .watch-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.38;

  .watch-box strong {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }

  /* RIGHT: HARDWARE TELEMETRY & CODE TRACE */
  .inspector {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .panel-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }

  .panel-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin-bottom: 6px;

  .kv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  .kv-table td {
    padding: 4px 0;
    border-bottom: 1px solid var(--bg-card);
    vertical-align: top;

  .kv-table tr:last-child td { border-bottom: none; }

  .kv-key {
    color: var(--ink-muted);
    font-weight: 600;
    width: 38%;
  }

  .kv-val {
    font-weight: 600;
  }

  pre.trace-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-size: 11px;
    line-height: 1.4;
    overflow-x: auto;
    white-space: pre-wrap;
    color: var(--ink);
  }

  /* SVG ANIMATIONS */

    to { stroke-dashoffset: -24; }
  }

  .signal-line {
    stroke: var(--blue);
    stroke-width: 2.2;
    stroke-dasharray: 6 6;
    animation: pulseFlow 0.9s linear infinite;
    fill: none;
  }

  .signal-line-orange {
    stroke: var(--orange);
    stroke-width: 2.2;
    stroke-dasharray: 6 6;
    animation: pulseFlow 0.9s linear infinite;
    fill: none;

  .svg-text-title { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: ui-sans-serif, system-ui, sans-serif; }
  .svg-text-sub { fill: var(--ink-muted); font-size: 9.5px; font-family: ui-monospace, monospace; }
  .svg-box { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; rx: 5; }
  .svg-box-accent { fill: var(--accent-bg); stroke: var(--blue); stroke-width: 2; rx: 5; }
  .svg-box-warn { fill: rgba(188, 82, 21, 0.1); stroke: var(--orange); stroke-width: 2; rx: 5; }
</style>

let currentStep = 0;
let completed = JSON.parse(localStorage.getItem("mad_hello_flow_done") || "{}");

function renderTopPipeline() {
  const layer = document.getElementById("pipeline-nodes-layer");
  layer.innerHTML = "";
  const startX = 15;
  const gap = 178;

  STAGES.forEach((s, idx) => {
    const x = startX + idx * gap;
    const isDone = !!completed[s.id];
    const isActive = idx === currentStep;
    const classes = [
      "pipe-node",
      isActive ? "active" : "",
      isDone ? "done" : "",
      s.isGap ? "missing-bridge" : ""
    ].join(" ");

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", classes);
    g.setAttribute("transform", `translate(${x}, 14)`);
    g.onclick = () => selectStep(idx);

    g.innerHTML = `
      <rect width="162" height="70"></rect>
      <text x="10" y="20" class="svg-text-sub" style="font-weight:700; fill:${s.isGap ? 'var(--orange)' : 'var(--ink-muted)'}">
        ${isDone ? '✓ ' : ''}${s.layer}
      </text>
      <text x="10" y="41" class="svg-text-title">${s.short}</text>
      <text x="10" y="58" class="svg-text-sub">${s.duration}</text>
    `;
    layer.appendChild(g);
  });
}

function renderSidebar() {
  const list = document.getElementById("step-list");
  list.innerHTML = "";

  STAGES.forEach((s, idx) => {
    const card = document.createElement("div");
    card.className = `step-card ${idx === currentStep ? "active" : ""} ${s.isGap ? "gap-card" : ""}`;
    card.onclick = (e) => {
      if (e.target.tagName !== "INPUT") selectStep(idx);
    };

    const checked = completed[s.id] ? "checked" : "";
    card.innerHTML = `
      <input type="checkbox" class="step-check" ${checked} onchange="toggleDone(${s.id}, this.checked)" title="Mark watched"/>
      <div>
        <div class="step-meta" style="color:${s.isGap ? 'var(--orange)' : ''}">${s.layer}</div>
        <div class="step-name">${s.short}</div>
        <div class="step-sub">${s.channel}</div>
      </div>
      <span class="step-time mono">${s.duration}</span>
    `;
    list.appendChild(card);
  });

  const doneCount = Object.values(completed).filter(Boolean).length;
  document.getElementById("progress-badge").textContent = `${doneCount} / ${STAGES.length} Completed`;
}

function selectStep(idx) {
  currentStep = idx;
  const s = STAGES[idx];

  document.getElementById("stage-title").textContent = s.title;
  document.getElementById("stage-station").textContent = s.station;
  document.getElementById("stage-svg-container").innerHTML = s.svg();

  // Video Deck
  document.getElementById("yt-iframe").src = `https://www.youtube-nocookie.com/embed/${s.videoId}?rel=0`;
  document.getElementById("vid-channel").textContent = `${s.channel} · STEP 0${s.id}`;
  document.getElementById("vid-duration").textContent = s.duration;
  document.getElementById("vid-title").textContent = s.videoTitle;
  document.getElementById("vid-covers").textContent = s.covers;
  document.getElementById("vid-skips").textContent = s.skips;

  const linksDiv = document.getElementById("video-links");
  const primaryUrl = `http://www.youtube.com/watch?v=${s.videoId}`;
  let linksHtml = `<a class="yt-btn" href="${primaryUrl}" target="_blank" rel="noopener">▶ Watch on YouTube (${s.duration}) ↗</a>`;
  if (s.secondaryUrl) {
    linksHtml += `<a class="yt-btn secondary" href="${s.secondaryUrl}" target="_blank" rel="noopener">${s.secondaryLabel} ↗</a>`;
  }
  linksDiv.innerHTML = linksHtml;

  // Inspector
  document.getElementById("phys-mech").textContent = s.mechanism;
  const table = document.getElementById("telemetry-table");
  table.innerHTML = s.telemetry.map(([k, v]) => `
    <tr>
      <td class="kv-key">${k}</td>
      <td class="kv-val mono">${v}</td>
    </tr>
  `).join("");

  document.getElementById("code-trace").textContent = s.trace;

  renderTopPipeline();
  renderSidebar();
}

function toggleDone(id, isChecked) {
  completed[id] = isChecked;
  localStorage.setItem("mad_hello_flow_done", JSON.stringify(completed));
  renderTopPipeline();
  renderSidebar();
}

function prevStep() {
  selectStep((currentStep - 1 + STAGES.length) % STAGES.length);
}

function nextStep() {
  selectStep((currentStep + 1) % STAGES.length);
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "light" ? "dark" : "light";
  html.setAttribute("data-theme", next);
  document.getElementById("theme-btn").textContent = `Theme: ${next.charAt(0).toUpperCase() + next.slice(1)}`;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextStep();
  if (e.key === "ArrowLeft") prevStep();
});

// Initialize
selectStep(0);
</script>
</body>
</html>
