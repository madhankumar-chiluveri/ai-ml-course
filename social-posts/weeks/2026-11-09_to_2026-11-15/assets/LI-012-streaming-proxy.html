<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>When an AI stream arrives all at once</title>
<style>
@font-face{font-family:Work;src:url('../../../skills/style-ref-editorial/assets/fonts/WorkSans-Regular.ttf')}
@font-face{font-family:Work;src:url('../../../skills/style-ref-editorial/assets/fonts/WorkSans-Bold.ttf');font-weight:700}
@font-face{font-family:Mono;src:url('../../../skills/style-ref-editorial/assets/fonts/JetBrainsMono-Regular.ttf')}
*{box-sizing:border-box}html,body{width:1080px;height:1350px;margin:0;overflow:hidden;background:#fffcf0;color:#100f0f;font-family:Work,Arial,sans-serif}
main{padding:66px 70px 46px;height:1350px;display:flex;flex-direction:column}
.eyebrow{font-size:25px;font-weight:700;letter-spacing:2px;color:#2246a8}
h1{font-size:79px;line-height:1.08;letter-spacing:0;margin:24px 0 18px;font-weight:700}
.sub{font-size:32px;line-height:1.35;color:#575653;margin:0}
.diagram{width:940px;height:695px;margin-top:42px;overflow:visible}
.takeaway{margin-top:18px;padding:24px 28px;background:#fff1b8;border:2px solid #100f0f;border-radius:20px;font-size:31px;line-height:1.3}
.takeaway strong{font-weight:700}
footer{margin-top:auto;border-top:2px solid #dad8ce;padding-top:19px;display:flex;justify-content:space-between;font-size:23px;font-weight:700;color:#575653}
svg text{font-family:Work,Arial,sans-serif;fill:#100f0f}svg .muted{fill:#575653}svg .blue{fill:#2246a8}svg .mono{font-family:Mono,monospace}
</style>
</head>
<body><main>
<div class="eyebrow">ILLUSTRATIVE DEBUGGING SCENARIO</div>
<h1>The stream works.<br>The user waits.</h1>
<p class="sub">A proxy can hold chunks before the client sees them.</p>
<svg class="diagram" viewBox="0 0 940 695" role="img" aria-label="Compare a direct stream to a buffered NGINX path, then check and retest the proxy setting.">
  <rect x="0" y="0" width="940" height="275" rx="25" fill="#ddf6e9" stroke="#100f0f" stroke-width="2"/>
  <text x="32" y="53" font-size="32" font-weight="700">1. DIRECT TO CLIENT</text>
  <rect x="32" y="85" width="228" height="74" rx="16" fill="#fffcf0" stroke="#100f0f" stroke-width="2"/>
  <text x="146" y="132" text-anchor="middle" font-size="30" font-weight="700">Backend</text>
  <path d="M275 122 H630" stroke="#100f0f" stroke-width="3"/>
  <path d="M621 112 L636 122 L621 132" fill="none" stroke="#100f0f" stroke-width="3"/>
  <rect x="650" y="85" width="255" height="74" rx="16" fill="#fffcf0" stroke="#100f0f" stroke-width="2"/>
  <text x="777" y="132" text-anchor="middle" font-size="30" font-weight="700">Client</text>
  <text x="32" y="225" font-size="30">Chunks can arrive gradually.</text>
  <rect x="0" y="301" width="940" height="288" rx="25" fill="#ffe2e8" stroke="#100f0f" stroke-width="2"/>
  <text x="32" y="354" font-size="32" font-weight="700">2. THROUGH A BUFFERING PROXY</text>
  <rect x="32" y="386" width="218" height="74" rx="16" fill="#fffcf0" stroke="#100f0f" stroke-width="2"/>
  <text x="141" y="433" text-anchor="middle" font-size="30" font-weight="700">Backend</text>
  <path d="M260 423 H318" stroke="#100f0f" stroke-width="3"/><path d="M309 413 L324 423 L309 433" fill="none" stroke="#100f0f" stroke-width="3"/>
  <rect x="336" y="386" width="235" height="74" rx="16" fill="#fff1b8" stroke="#100f0f" stroke-width="2"/>
  <text x="453" y="433" text-anchor="middle" font-size="30" font-weight="700">NGINX</text>
  <path d="M583 423 H640" stroke="#100f0f" stroke-width="3"/><path d="M631 413 L646 423 L631 433" fill="none" stroke="#100f0f" stroke-width="3"/>
  <rect x="656" y="386" width="249" height="74" rx="16" fill="#fffcf0" stroke="#100f0f" stroke-width="2"/>
  <text x="780" y="433" text-anchor="middle" font-size="30" font-weight="700">Client</text>
  <text x="32" y="525" font-size="30">Chunks may arrive in a batch.</text>
  <text x="32" y="562" font-size="25" class="muted">Illustration, not a measured trace</text>
  <text x="2" y="655" font-size="31" font-weight="700" class="blue">CHECK THE STREAMING ROUTE</text>
  <text x="2" y="691" font-size="29" class="mono">proxy_buffering off;</text>
</svg>
<div class="takeaway"><strong>Retest the complete path.</strong> Other layers can buffer too.</div>
<footer><span>AI PRODUCT ENGINEERING</span><span>madvibe.ai</span></footer>
</main></body></html>
