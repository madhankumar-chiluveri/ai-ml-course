<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madhan technical social card</title>
  <style>
    :root {
      --paper: #fbf8f1;
      --ink: #111318;
      --note: #2246a8;
      --mint: #ddf6e9;
      --lilac: #ece6ff;
      --butter: #fff1b8;
      --rose: #ffe2e8;
      --sky: #dff2ff;
      --muted: #5d6470;
      --rule: #cdd3dc;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, Arial, sans-serif; }
    .canvas { width: 1080px; height: 1350px; padding: 68px 72px 52px; display: grid; grid-template-rows: auto 1fr auto; gap: 34px; }
    .eyebrow { color: var(--note); font-size: 24px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 18px 0 14px; max-width: 900px; font-family: "Arial Black", Inter, Arial, sans-serif; font-size: 84px; line-height: .96; letter-spacing: -.055em; }
    .dek { max-width: 840px; color: var(--note); font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 32px; line-height: 1.25; }
    .evidence { display: grid; align-content: center; gap: 22px; }
    .card { border: 2px solid var(--ink); border-radius: 24px; padding: 28px; background: var(--sky); }
    .card h2 { margin: 0 0 12px; font-size: 34px; }
    .card p { margin: 0; color: var(--muted); font-size: 28px; line-height: 1.32; }
    footer { display: flex; justify-content: space-between; border-top: 2px solid var(--rule); padding-top: 20px; color: var(--muted); font-size: 23px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="canvas">
    <header>
      <div class="eyebrow">Series label</div>
      <h1>Replace with one clear claim.</h1>
      <div class="dek">Add one short handwritten clarification.</div>
    </header>
    <section class="evidence">
      <article class="card">
        <h2>Evidence object</h2>
        <p>Replace this card with the smallest diagram, result, or decision structure that proves the claim.</p>
      </article>
    </section>
    <footer><span>AI PRODUCT ENGINEERING</span><span>Madhan Kumar</span></footer>
  </main>
</body>
</html>
